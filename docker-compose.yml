services:
  web:
    build: .
    container_name: probash-mart-backend
    restart: unless-stopped
    ports:
      - "8003:8000"
    env_file:
      - .env.production
    volumes:
      - ./media:/app/media
      - ./db:/app/db
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/products/')"]
      interval: 30s
      timeout: 10s
      retries: 3
